name: Deploy YamiBot to Koyeb

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests (if available)
      run: |
        # Add your test commands here
        # For example:
        # python -m pytest tests/
        echo "No tests configured yet"
    
    - name: Build Docker image
      run: |
        docker build -f deployment/Dockerfile -t ${{ env.IMAGE_NAME }}:latest .
    
    - name: Test Docker image
      run: |
        # Test that the container starts
        docker run --rm -d --name yamibot-test ${{ env.IMAGE_NAME }}:latest
        sleep 5
        docker logs yamibot-test
        docker stop yamibot-test

  deploy-to-koyeb:
    name: Deploy to Koyeb
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: deployment/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Trigger Koyeb deployment
      run: |
        # Replace with your actual Koyeb deployment webhook
        # You can get this from your Koyeb service settings
        # curl -X POST "${{ secrets.KOYEB_WEBHOOK_URL }}" \
        #   -H "Content-Type: application/json" \
        #   -d '{"image": "${{ steps.meta.outputs.tags }}"}'
        
        echo "Koyeb deployment would be triggered here"
        echo "Make sure to set up your Koyeb webhook in GitHub secrets"
        echo "Webhook URL should be stored as KOYEB_WEBHOOK_URL secret"

